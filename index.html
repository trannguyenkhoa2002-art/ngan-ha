<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chinh Phục Ngân Hà</title>
<style>
:root{--bg:#05061a;--pan:#0e1230;--pan2:#171c45;--line:#3a4590;--ink:#dfe6ff;--dim:#8a93c7;--acc:#ffcc4d;--ok:#5be08a;--bad:#ff6b6b;--m:#b8c0d8;--c:#4fe3ff;--f:#ff9a3c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 "Courier New",ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:var(--pan2);border:2px solid var(--line);box-shadow:2px 2px 0 #000;padding:4px 9px;cursor:pointer}
button:hover:not(:disabled){background:#252c66;border-color:var(--acc)}
button:active:not(:disabled){transform:translate(1px,1px);box-shadow:1px 1px 0 #000}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:#2a3a8a;border-color:var(--acc);color:#fff}
select,input[type=number]{background:#0a0d24;border:2px solid var(--line);padding:3px 5px}
#top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:6px 10px;background:var(--pan);border-bottom:3px solid #000;box-shadow:0 2px 0 var(--line)}
.logo{color:var(--acc);font-weight:bold;letter-spacing:1px}
.chip{display:flex;align-items:center;gap:6px;white-space:nowrap}
.ic{display:inline-block;width:10px;height:10px;border:1px solid #000;vertical-align:middle}
.icl{font-size:10px;font-weight:bold;margin:0 3px 0 2px}.icl.m{color:var(--m)}.icl.c{color:var(--c)}.icl.f{color:var(--f)}.icl.r{color:#e07bff}
.ic.m{background:var(--m)}.ic.c{background:var(--c)}.ic.f{background:var(--f)}.ic.r{background:#e07bff}
.dim{color:var(--dim)}.ok{color:var(--ok)}.bad{color:var(--bad)}.acc{color:var(--acc)}
#ctl{margin-left:auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
#ctl button.on{background:var(--acc);color:#000;border-color:#fff}
main{flex:1;display:flex;min-height:0}
#mapwrap{flex:1;position:relative;min-width:0;background:#000}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
#hint{position:absolute;left:8px;bottom:8px;color:var(--dim);background:#000a;padding:3px 8px;pointer-events:none;font-size:12px}
#toast{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:70%}
.tt{background:#000c;border:2px solid var(--line);padding:4px 8px;animation:fade 7s forwards}
.tt.warn{border-color:var(--bad)}.tt.good{border-color:var(--ok)}.tt.info{border-color:var(--acc)}
@keyframes fade{0%,85%{opacity:1}100%{opacity:0}}
#home{position:absolute;right:8px;top:8px}
#mini{position:absolute;right:8px;bottom:8px;width:150px;height:150px;border:2px solid var(--line);background:#000c;cursor:pointer;image-rendering:pixelated;box-shadow:2px 2px 0 #000}
#side{width:390px;max-width:46vw;display:flex;flex-direction:column;background:var(--pan);border-left:3px solid #000;box-shadow:-2px 0 0 var(--line)}
#tabs{display:flex;flex-wrap:wrap;gap:3px;padding:6px;border-bottom:2px solid var(--line)}
#tabs button{padding:3px 7px;font-size:12px}
#tabs button.on{background:var(--acc);color:#000;border-color:#fff}
#panel{flex:1;overflow:auto;padding:8px}
h3{margin:0 0 6px;font-size:14px;color:var(--acc)}
h4{margin:10px 0 4px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;border-bottom:1px dashed var(--line)}
.row{display:flex;gap:8px;align-items:center;margin:3px 0}
.row .grow{flex:1;min-width:0}
.card{background:var(--pan2);border:2px solid var(--line);padding:6px 8px;margin:5px 0}
.card.sel{border-color:var(--acc)}
.card.click{cursor:pointer}.card.click:hover{border-color:#fff}
.bar{height:8px;background:#05071a;border:1px solid #000;margin-top:3px}
.bar>i{display:block;height:100%;background:var(--acc)}
.tag{display:inline-block;padding:0 5px;border:1px solid #000;color:#000;font-size:11px;font-weight:bold}
.spr{width:32px;height:32px;image-rendering:pixelated;flex:none}
.stack{display:flex;height:14px;border:2px solid #000;background:#222}
.stack>i{display:block;height:100%}
.pw{height:10px;background:#05071a;border:1px solid #000}.pw>i{display:block;height:100%}
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9;padding:10px}
#modal[hidden]{display:none}
.box{background:var(--pan);border:3px solid var(--acc);box-shadow:5px 5px 0 #000;padding:14px 16px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.box p{margin:6px 0}
.box label{display:block;margin:6px 0}
.box label>select{width:100%;margin-top:2px}
.gap{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
#tut{position:absolute;left:8px;bottom:36px;max-width:calc(100% - 200px);background:#000d;border:2px solid var(--acc);padding:6px 10px;z-index:3;box-shadow:3px 3px 0 #000}
#tut[hidden]{display:none}
#tut b{color:var(--acc)}#tut button{margin-top:4px;padding:1px 7px;font-size:12px}
.hl{outline:3px solid var(--acc);outline-offset:1px;animation:pulse 1s infinite}
@keyframes pulse{50%{outline-color:#fff;box-shadow:0 0 12px var(--acc)}}
#sidetoggle{display:none}
.techsticky{position:sticky;top:0;z-index:5;background:var(--pan2);box-shadow:0 4px 8px rgba(0,0,0,.6)}
.chipb{padding:2px 6px;font-size:11px;min-height:0}.chipb.on{background:var(--acc);color:#000;border-color:#fff}
.rgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0}.rc{background:var(--pan2);border:2px solid var(--line);padding:2px;text-align:center;cursor:pointer}
.rc.unk .rimg{filter:brightness(0);opacity:.45}.rc.sel{border-color:#fff}.rc.mine{border-color:var(--ok)}.rimg{width:100%;image-rendering:pixelated;display:block}.rn{font-size:8.5px;line-height:1.1;height:19px;overflow:hidden}
.shp{width:48px;height:48px;image-rendering:pixelated;flex:none}.shp.sm{width:30px;height:30px}.shp.xs{width:30px;height:30px}
.shp.fut{filter:grayscale(1) brightness(.6);opacity:.55}.shp.cur{outline:2px solid var(--acc);background:#0008}
.tiers{display:flex;gap:4px;margin-top:4px;align-items:center;flex-wrap:wrap}
.ico{width:32px;height:32px;image-rendering:pixelated;flex:none}.ico.big{width:80px;height:80px}
.ico.pulse{animation:bob 1.2s steps(2) infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.treebox{position:relative;margin:6px 0 12px;max-width:100%}
.tn{position:absolute;width:58px;height:76px;background:var(--pan2);border:2px solid var(--line);padding:3px;text-align:center;cursor:pointer;overflow:hidden}
.tn:hover{border-color:#fff}.tn .ico{display:block;margin:0 auto 2px;width:36px;height:36px}
.tn .tnn{font-size:8.5px;line-height:1.1;height:19px;overflow:hidden}
.pips{display:flex;gap:1px;justify-content:center;margin-top:2px}.pips i{width:5px;height:5px;background:#05071a;border:1px solid #000}.pips i.on{background:var(--acc)}
.tn.lock{filter:grayscale(1);opacity:.55}.tn.max{border-color:var(--acc)}.tn.sel{outline:2px solid #fff}.tn.cur{animation:pulse 1s infinite}
.devonly{display:none}body.dev .devonly{display:inline-block}
/* Khung điều khiển kiểu máy tính pixel. */
#top{background:linear-gradient(180deg,#182443,#0d142c);border-bottom:2px solid #4a6489;box-shadow:0 3px 0 #030611;z-index:2}
.logo{color:#ffe1a1;text-shadow:2px 2px #080b18}
.chip .ic{box-shadow:1px 1px #000,inset 1px 1px #ffffff70}
button{border-color:#41557b;box-shadow:2px 2px #030611,inset 1px 1px #ffffff12;transition:background-color .12s,border-color .12s}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #77e6ff;outline-offset:3px}
#side{background:#0b1328;border-left-color:#030611;box-shadow:-2px 0 #41557b}
#tabs{background:#101c35;border-bottom-color:#324867}
#tabs button.on,#ctl button.on{background:#f6cf83;color:#171a27;border-color:#fff0c7;box-shadow:2px 2px #030611,inset 0 -2px #c2924f}
.card{background:linear-gradient(135deg,#17253f,#111c34);border-color:#304666;box-shadow:2px 2px #050a17,inset 1px 1px #ffffff08}
.card.sel{border-color:#edc67f}.card.click:hover{background:#1d3050;border-color:#84b8d6}
.bar,.pw{height:9px;border-color:#030713;box-shadow:0 1px #ffffff12}
.bar>i,.pw>i{background-image:repeating-linear-gradient(90deg,transparent 0 5px,#0003 5px 6px);box-shadow:inset 0 2px #ffffff35}
#panel{scrollbar-width:thin;scrollbar-color:#41557b #0a1022}
#hint{border-left:2px solid #607f9f;background:#080e20db;color:#a7bad2}
#mini{border-color:#627e9d;box-shadow:3px 3px #02050c,inset 0 0 0 2px #0d182c}
.box{background:linear-gradient(135deg,#182844,#0b142b);border-color:#f6cf83;box-shadow:6px 6px #02050c,inset 2px 2px #ffffff0c}
.tt{box-shadow:3px 3px #02050c;animation:toast-in .2s steps(4),fade 7s forwards}
@keyframes toast-in{from{transform:translateX(-12px);opacity:0}to{transform:translateX(0);opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:800px){main{flex-direction:column}#side{width:100%;max-width:none;height:46%;border-left:0}#mapwrap{flex:1;min-height:0}
 #sidetoggle{display:block;width:100%;border-width:0 0 2px;box-shadow:none;padding:3px}
 #top{padding:4px 6px;gap:4px 8px}.logo{display:none}#hint{display:none}#mini{width:96px;height:96px}#tut{max-width:calc(100% - 120px);font-size:11px;line-height:1.3;bottom:8px;padding:4px 6px;max-height:96px;overflow:auto}#tut button{min-height:0;padding:1px 6px}
 #ctl button{padding:3px 6px}
 body.sidemin #side{height:auto}body.sidemin #panel,body.sidemin #tabs{display:none}}
@media(pointer:coarse){button{min-height:34px}#tabs button{padding:6px 9px}}
</style>
</head>
<body>
<header id="top">
  <div class="logo">★ CHINH PHỤC NGÂN HÀ</div>
  <div class="chip"><i class="ic m" title="Kim loại"></i><span class="icl m">KL</span><span id="rm">0</span><span class="dim" id="dm"></span></div>
  <div class="chip"><i class="ic c" title="Tinh thể"></i><span class="icl c">TT</span><span id="rc">0</span><span class="dim" id="dc"></span></div>

  <div class="chip dim" id="clock"></div>

    <button data-act="help">?</button><button data-act="music" id="music">♪</button><button data-act="mute" id="mute">🔊</button><button data-act="save">Lưu</button><button data-act="new">Chơi lại</button>
  </div>
</header>
<main>
  <div id="mapwrap"><canvas id="map"></canvas><div id="toast"></div><button id="home" data-act="gohome">⌂ Về nhà</button><canvas id="mini" width="150" height="150"></canvas><div id="tut" hidden></div><div id="hint">Kéo để di chuyển · Lăn chuột để phóng to/thu nhỏ · Bấm vào hệ sao để xem</div></div>
  <aside id="side"><button id="sidetoggle" data-act="sidetoggle">▼ Thu gọn bảng</button><nav id="tabs"></nav><div id="panel"></div></aside>
</main>
<div id="modal" hidden></div>

<script>
(()=>{'use strict';
/* ======================= TIỆN ÍCH ======================= */
const $=s=>document.querySelector(s);
const W=2000,H=2000,CX=1000,CY=1000,ARMS=5,SAVE='nganha_v19',PR=1,WINSHARE=.2;
const spiral=(a,t)=>{const r=130+t*800,ang=a*2*Math.PI/ARMS+t*2.7;return[CX+Math.cos(ang)*r,CY+Math.sin(ang)*r]};
const rng=seed=>{let s=seed>>>0;return()=>((s=(Math.imul(s,1664525)+1013904223)>>>0)/4294967296)};
const hash=(x,y,s)=>{let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,2147483647))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296};
const vnoise=(x,y,s)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v};
const fmt=n=>n>=1e5?(n/1000).toFixed(0)+'k':n>=1e4?(n/1000).toFixed(1)+'k':Math.floor(n).toString();
const fmtT=s=>{s=Math.max(0,Math.ceil(s*((typeof G!=='undefined'&&G&&G.tempo)||1)));const m=Math.floor(s/60),h=Math.floor(m/60),d=Math.floor(h/24);return d>=7?Math.floor(d/7)+' tuần '+(d%7)+'n':d>=1?d+'n '+String(h%24).padStart(2,'0')+'g':h>=1?h+'g'+String(m%60).padStart(2,'0')+'p':m>0?m+'p'+String(s%60).padStart(2,'0')+'s':s+'s'};
const rateStr=v=>{const T=(G&&G.tempo)||1;if(T===1)return(v>=0?'+':'')+v.toFixed(1)+'/s';const x=v*3600/T;const ax=Math.abs(x);return(x>=0?'+':'-')+(ax<10?ax.toFixed(1):fmt(ax))+'/giờ'};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ROMAN=['I','II','III','IV'];
const NAMES=['Sirius','Vega','Altair','Rigel','Antares','Polaris','Arcturus','Betelgeuse','Capella','Deneb','Procyon','Aldebaran','Spica','Regulus','Castor','Pollux','Fomalhaut','Mira','Algol','Bellatrix','Canopus','Achernar','Hadar','Mizar','Alcor','Thuban','Altera','Kepler','Orion','Lyra','Draco','Cygnus','Hydra','Phoenix','Pegasus','Andromeda','Cassiopeia','Perseus','Aquila','Corvus','Centaurus','Carina','Vela','Lupus','Taurus','Gemini','Scorpius','Libra','Pavo','Tucana','Fornax','Eridanus','Auriga','Cepheus','Lacerta','Norma','Sagitta','Volans','Dorado','Crux','Ara','Hercules','Lynx','Serpens','Pyxis','Mensa','Columba'];

const PAL={rock:['#5a4a38','#7a6a4a','#4a7a3a','#356a2c'],ice:['#7aa8d8','#9ec7f0','#cfe8ff','#e8f6ff'],gas:['#a85a2a','#c27a38','#e0a050','#f0c878'],lava:['#2a1a18','#4a2018','#c8401a','#ffb030'],ocean:['#1f5fa8','#2f7fc8','#3f9a50','#d8e8f0'],desert:['#a87838','#c89850','#d8b070','#e8c888']};
const BLD={
 mine:{n:'Mỏ kim loại',m:60,c:15,t:12,f:1.5,d:'Sản xuất kim loại (tốn điện)'},
 cry:{n:'Mỏ tinh thể',m:48,c:24,t:14,f:1.55,d:'Sản xuất tinh thể (tốn điện)'},

const SH={

 colony:{n:'Tàu thực dân',m:240,c:160,f:80,rt:6,t:30,spd:180,atk:0,hp:40,fr:.1,yd:2,d:'Lập thuộc địa trên hành tinh trống — tiêu hao 1 tàu khi thành công'}};
const TECH={
 drive:{n:'Động cơ ion',br:'Hạm đội',d:'+15% tốc độ hạm đội / cấp',m:200,c:300,f:100,t:50},
 warp:{n:'Động cơ cong không gian',br:'Hạm đội',d:'+25% tốc độ, −10% nhiên liệu / cấp',m:500,c:700,f:300,t:90,req:{drive:3},lab:3},
 sensor:{n:'Cảm biến sâu',br:'Hạm đội',d:'+20% tầm thám hiểm / cấp',m:150,c:250,f:50,t:45},
 deepscan:{n:'Radar thuộc địa',br:'Hạm đội',d:'Mỗi hành tinh của bạn tự khám phá xung quanh (tầm +60 / cấp) và khảo sát các hành tinh cùng hệ',m:350,c:500,f:150,t:80,req:{sensor:3},lab:3},
 weapon:{n:'Vũ khí laser',br:'Quân sự',d:'+10% sát thương / cấp (cần cấp 2 để mở Tuần dương hạm)',m:300,c:200,f:50,t:60},
 missile:{n:'Tên lửa dẫn đường',br:'Quân sự',d:'Mở Oanh tạc cơ; +8% sát thương / cấp',m:400,c:300,f:100,t:70,req:{weapon:2},lab:2},
 plasma:{n:'Pháo plasma',br:'Quân sự',d:'Mở Chiến hạm; +10% sát thương / cấp',m:900,c:700,f:300,t:110,req:{weapon:4,missile:1},lab:4},
 armor:{n:'Giáp hợp kim',br:'Quân sự',d:'+10% máu hạm đội / cấp',m:250,c:150,f:50,t:60},

function adaptDoc(F){
  if(G.t<(F.adaptT||0))return;F.adaptT=G.t+600;
  const w={light:0,bomb:0,heavy:0};let tot=0;
  const add=ships=>{for(const k in ships){const d=SH[k];if(d.cls){const a=ships[k]*d.atk;w[d.cls]+=a;tot+=a}}};
  own().forEach(p=>add(p.ships));G.fleets.forEach(f=>add(f.ships));
  if(tot<50){F.doc=null;return}
  const dom=Object.keys(w).sort((a,b)=>w[b]-w[a])[0];
  if(w[dom]/tot>.5){const c=counterOf(dom);if(F.doc!==c){F.doc=c;if(F.known)addLog(`🧠 ${FAC[F.id].n} đổi học thuyết sang ${CLS[c]} để khắc chế hạm đội ${CLS[dom]} của bạn!`,'warn')}}
  else F.doc=null;
}

function scheduleRaid(F,mine){
  if(catchup){F.nextRaid=G.t+600;return}
  const share=own().length/G.planets.length,co=G.coalition&&!F.ally;
  const top=mine.map(p=>p.dp).sort((a,b)=>b-a).slice(0,3),cap=Math.max(20,top.reduce((a,b)=>a+b,0)/top.length*1.1*(1+G.t/18000)*DIFF[G.diff].raid)*(1+(F.learn||0))*(co?1+share*2:1);
  const away=awayFrac()>.5;
  let best=null,bs=-1,bn=0;
  own().forEach(p=>{
    if(((F.avoid||{})[p.id]||0)>G.t&&!co)return;
    if(p.home&&G.t<BAL.homeSiege)return;
    const d=Math.min(...mine.map(m=>dist(SYS(p.sys),SYS(m.sys))));if(d>620+G.t/6)return;
    const need=needS(defEstimate(p))*(away?.8:1);if(need>cap)return;
    const rev=p.lostFrom===F.id&&G.t-p.lostT<3600;
    const val=1+((p.mult.m||0)+(p.mult.c||0)+(p.mult.f||0)+(p.mult.r||0))*.4+(p.home?3:0)+(rev?2.5:0);
    const sc=val/need/(1+d/400)*(.85+Math.random()*.3);if(sc>bs){bs=sc;best=p;bn=need}
  });
  if(!best){F.nextRaid=G.t+300;F.learn=Math.min(.8,(F.learn||0)+.03);return}
  const S=Math.min(cap,bn*1.15),ratio=S/bn,rev=best.lostFrom===F.id&&G.t-best.lostT<3600;
  const homeOk=best.home&&G.t>=BAL.homeSiege&&ratio>=1.1&&(F.rel<-20||co);
  const invade=G.t>=BAL.invadeStart&&FAC[F.id].aggr>=.5&&(!best.home||homeOk)&&Math.random()<(rev?.8:ratio>=1.15?.5:.3);
  const orig=mine.slice().sort((a,b)=>dist(SYS(a.sys),SYS(best.sys))-dist(SYS(b.sys),SYS(best.sys)))[0],dur=clamp(dist(SYS(orig.sys),SYS(best.sys))/6,60,260);
  G.raids.push({t0:G.t,t:G.t+dur,o:orig.sys,fac:F.id,pid:best.id,S,invade,homeOk:invade&&best.home});
  F.nextRaid=G.t+(2000+Math.random()*1200)/FAC[F.id].aggr*(pol('peace')?1.4:1)*(1+fx('peace'))*(1+Math.max(0,F.rel)/40)/(1+Math.max(0,-F.rel)/100)*(co?.6:1);
  addLog(`⚠ ${F.known?FAC[F.id].n:'Hạm đội không rõ danh tính'} ${invade?'ĐỔ BỘ chiếm':'đang lao tới'} ${best.name}${away?' (nhân lúc hạm đội của bạn vắng mặt)':''}${best.home?' — HÀNH TINH MẸ!':''} (còn ${fmtT(dur)})! Hãy tăng viện hoặc chặn đánh.`,'warn');
}
function resolveRaid(r){
  const p=PL(r.pid);if(p.owner!==0)return;
  const fs=fstats(p.ships),L=p.b.def,def={atk:(fs.atk+7*L*(1+.12*G.tech.flak+fx('turret')))*(pol('def')?1.3:1),hp:fs.hp*(pol('def')?1.1:1)+70*L*(1+.15*G.tech.shield)*(1+.12*G.tech.flak+fx('turret'))*(pol('def')?1.3:1)+1},att={atk:.8*r.S*Math.max(.5,1-fx('raidRes')),hp:6*r.S*Math.max(.5,1-fx('raidRes'))};
  const docR=r.fac>0?facDoc(r.fac):'light',res=fight(att,def,mulOf(docR,p.ships),mulVs(p.ships,docR));if(!quiet){const ss=SYS(p.sys);fxBattle(ss.x,ss.y);fxBurst(ss.x,ss.y,res.aw?'#ff6b6b':FAC[0].col,26);SFX.boom()}
  for(const k in p.ships)p.ships[k]=Math.floor(p.ships[k]*(1-res.dL));
  if(r.rebel){
    if(res.aw&&!p.home){p.owner=-1;p.b={mine:0,cry:0,fuel:0,pow:0,yard:0,lab:0,store:0,def:0,rare:0};p.ships={};p.yq=[];p.bq=[];p.dp=Math.round((p.ndp||60)*.7);p.unrest=0;p.coop=false;addLog(`✖ Dân ${RACES[p.race].n} đã giành lại ${p.name}! Phải trấn áp lại họ.`,'warn')}
    else{p.unrest=Math.max(0,(p.unrest||0)-30);addLog(`✔ Dập tắt cuộc nổi dậy tại ${p.name}.`,'good')}
    return;
  }
  if(r.fac>0&&r.fac<5){const FF=G.facs[r.fac];if(res.aw)FF.learn=Math.max(0,(FF.learn||0)*.85);else{FF.learn=Math.min(.8,(FF.learn||0)+.15);(FF.avoid=FF.avoid||{})[p.id]=G.t+1800}}
  if(res.aw&&r.invade&&(!p.home||r.homeOk)&&r.fac>0){
    if(p.home){G.homeFall={by:FAC[r.fac].n,t:G.t};addLog(`💀 HÀNH TINH MẸ ${p.name} ĐÃ THẤT THỦ trước ${FAC[r.fac].n}!`,'warn')}
    p.owner=r.fac;p.dp=Math.max(15,r.S*.6);p.b={mine:0,cry:0,fuel:0,pow:0,yard:0,lab:0,store:0,def:0,rare:0};p.ships={};p.yq=[];p.bq=[];
    addLog(`⚔ ${p.name} đã thất thủ trước ${FAC[r.fac].n}! Hãy phản công để chiếm lại.`,'warn');
  }else if(res.aw){
    const lost={m:G.res.m*.2,c:G.res.c*.2,f:G.res.f*.2};G.res.m-=lost.m;G.res.c-=lost.c;G.res.f-=lost.f;
    addLog(`✖ ${p.name} bị cướp phá! Mất 20% tài nguyên và ${Math.round(res.dL*100)}% hạm đội đồn trú.`,'warn');
  }else addLog(`✔ Đẩy lùi cuộc tập kích tại ${p.name}! (tổn thất ${Math.round(res.dL*100)}%)`,'good');
}
function step(dt){
  G.t+=dt;
  const r=rates(),cap=totalCap(),sf=G.t<G.storm?.5:1;
  for(const k of['m','c','f','r'])if(G.res[k]<cap)G.res[k]=Math.min(cap,G.res[k]+r[k]*sf*dt);
  if(G.res.f<0)G.res.f=0;
  own().forEach(p=>{
    {const done=p.bq.filter(q=>G.t>=q.end);if(done.length){p.bq=p.bq.filter(q=>G.t<q.end);done.forEach(q=>{p.b[q.k]++;addLog(`${BLD[q.k].n} cấp ${p.b[q.k]} hoàn thành tại ${p.name}.`,'good')})}}
    while(p.yq.length&&G.t>=p.yq[0].end){const q=p.yq.shift();p.ships[q.k]=(p.ships[q.k]||0)+1;if(!p.yq.some(x=>x.k===q.k))addLog(`${SH[q.k].n} đã sẵn sàng tại ${p.name}.`,'info',false)}
  });
  if(G.rq&&G.t>=G.rq.end){const tb0=tierMap();G.tech[G.rq.k]++;fxRefresh();{const tb1=tierMap();for(const sk in tb1)if(tb1[sk]>tb0[sk])addLog(`🛠 ${SH[sk].n} nâng lên Mk ${ROMN[tb1[sk]]} — thiết kế tàu mới!`,'good')}addLog(`Nghiên cứu xong: ${TECH[G.rq.k].n} cấp ${G.tech[G.rq.k]}.`,'good');G.rq=null}
  G.fleets.slice().forEach(f=>{if(G.t>=f.t1)f.phase==='out'?fleetArrive(f):fleetHome(f)});
  if(!catchup)G.raids=G.raids.filter(x=>{if(G.t>=x.t){resolveRaid(x);return false}return true});
  if(G.t>=G.nextEv){G.nextEv=G.t+480+Math.random()*360;if(!catchup)randomEvent()}
  G.qacc+=dt*(G.tempo||1);if(G.qacc>=1){G.qacc=0;checkQuests()}
  G.acc+=dt;while(G.acc>=10){G.acc-=10;npcTick()}
}

function upgradeResearchPace(){
  if(G.researchPace===1)return;
  if(G.rq){
    const q=G.rq,oldTotal=q.t||Math.max(0,q.end-G.t),remaining=oldTotal>0?clamp((q.end-G.t)/oldTotal,0,1):0;
    q.t=Math.min(oldTotal,tcost(q.k,G.tech[q.k]||0).t);q.end=G.t+q.t*remaining;
  }
  G.researchPace=1;
}
function upgradeStarterResources(){
  if(G.starterResources===1)return;
  if(!G.lost&&G.t<BAL.earlyT){
    const old={m:450,c:220,f:110,r:30},mul=DIFF[G.diff].res,cap=totalCap();
    for(const k in START_RES){const bonus=Math.round(START_RES[k]*mul)-Math.round(old[k]*mul);G.res[k]+=Math.min(bonus,Math.max(0,cap-G.res[k]))}
    addLog('Tiếp tế tân thủ: đã bổ sung phần tài nguyên khởi đầu được tăng thêm.','good');
  }
  G.starterResources=1;
}
function save(msg){try{localStorage.setItem(SAVE,JSON.stringify({ts:Date.now(),G}));if(msg)showToast('Đã lưu game.','good')}catch(e){}}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(SAVE));if(!s||!s.G||s.G.v!==13)return false;
    G=s.G;fxRefresh();upgradeResearchPace();
    const tp=G.tempo||1,real=clamp((Date.now()-s.ts)/1000,0,14*86400),el=real/tp;
    if(real>20){
      const dt=Math.max(5,el/5000);quiet=true;catchup=true;
      for(let t0=0;t0<el;t0+=dt)step(Math.min(dt,el-t0));
      catchup=false;quiet=false;
      G.facs.forEach(f=>f.nextRaid=Math.max(f.nextRaid,G.t+600));G.raids.forEach(r=>r.t=Math.max(r.t,G.t+60));
      if(G.crisis.state===2)G.crisis.next=Math.max(G.crisis.next,G.t+300);
      addLog(`Chào mừng trở lại! Bạn vắng mặt ${fmtT(el)}. Đế chế vẫn sản xuất và xây dựng; các thế lực địch và Bầy Hư Không không tấn công khi bạn vắng mặt.${['m','c','f','r'].some(k=>G.res[k]>=totalCap()-1)?' ⚠ Kho đã đầy trong lúc bạn vắng — hãy nâng Kho chứa.':''}`,'info');
    }
    upgradeStarterResources();
    return true;
  }catch(e){return false}
}

function finishPixel(c,depth=.16){
  const g=c.getContext('2d'),S=c.width,im=g.getImageData(0,0,S,S),d=im.data,out=new Uint8ClampedArray(d);
  const solid=(x,y)=>x>=0&&y>=0&&x<S&&y<S&&d[(y*S+x)*4+3]>0;
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const i=(y*S+x)*4;
    if(!d[i+3]){if([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>solid(x+dx,y+dy))){out[i]=7;out[i+1]=12;out[i+2]=25;out[i+3]=255}continue}
    const edge=!solid(x,y-1)||!solid(x-1,y),shadow=!solid(x,y+1)||!solid(x+1,y);
    const band=y<S*.36?1.08:y<S*.7?1:.85,m=edge?1+depth:shadow?1-depth*1.5:band;
    for(let j=0;j<3;j++)out[i+j]=Math.min(255,Math.round(d[i+j]*m/8)*8);
  }
  g.putImageData(new ImageData(out,S,S),0,0);return c;
}

function fmMissions(){
  const tp=FM.tp!=null?PL(FM.tp):null,m=[['explore','Thám hiểm']];
  if(tp&&tp.owner===-1&&!(tp.surveyed&&tp.race>=0&&tp.att==='host'))m.push(['colonize','Thực dân hóa']);
  if(tp&&isHost(tp)&&tp.surveyed)m.push(['attack','Trấn áp dân bản địa']);
  if(tp&&tp.owner>0)m.push(['attack','Tấn công']);
  if(tp&&!tp.surveyed&&tp.owner!==0)m.push(['survey','Khảo sát (xem trữ lượng, đặc tính)']);
  if(tp&&(tp.owner>0||(isHost(tp)&&tp.surveyed)))m.push(['recon','Do thám']);
  if(tp&&tp.owner===0){m.push(['defend','Tăng viện (đóng quân)']);if(G.raids.some(r=>r.pid===tp.id))m.push(['intercept','Chặn đánh đợt tập kích'])}
  if(!tp&&SYS(FM.ts).st===1)m.push(['expedition','Viễn chinh (ngẫu nhiên)']);
  return m;
}
function fmUpdate(){
  const ms=fmMissions();if(!ms.some(m=>m[0]===FM.ms))FM.ms=(ms.find(m=>m[0]==='intercept')||ms.find(m=>m[0]==='survey')||ms.find(m=>m[0]==='colonize')||ms.find(m=>m[0]==='attack')||ms.find(m=>m[0]==='defend')||ms.find(m=>m[0]==='expedition')||ms[0])[0];
  $('#fm-ms').innerHTML=ms.map(m=>`<option value="${m[0]}" ${m[0]===FM.ms?'selected':''}>${m[1]}</option>`).join('');
  const ships={};let tot=0;for(const k in FM.n){const v=clamp(Math.floor(+FM.n[k]||0),0,PL(FM.src).ships[k]||0);if(v>0){ships[k]=v;tot+=v}}
  const a=SYS(PL(FM.src).sys),b=SYS(FM.ts),d=routeDist(PL(FM.src),FM.ts,FM.tp,G.fid+1);let err='',info='';
  if(!tot)err='Hãy chọn ít nhất 1 tàu.';
  else{
    const ks=Object.keys(ships),spd=Math.min(...ks.map(k=>SH[k].spd))*spdMul(),dur=Math.max(.5,d/spd),fuel=Math.ceil(ks.reduce((s,k)=>s+SH[k].fr*ships[k]*Math.max(d,60)/10,0)*fuelMul());
    const fs=fstats(ships);
    info=`Quãng đường ≈${Math.round(d)} (từ hành tinh xuất phát tới đích) · Đến nơi sau <b>${fmtT(dur)}</b><br>Nhiên liệu: <span class="${G.res.f>=fuel?'':'bad'}">${ic('f')}${fuel}</span> · Công ${Math.round(fs.atk)} · Máu ${Math.round(fs.hp)}`;
    if(G.res.f<fuel)err='Không đủ nhiên liệu.';
    if(FM.ms==='colonize'&&!(ships.colony>0))err='Cần ít nhất 1 Tàu thực dân.';
    if(FM.ms==='attack'&&fs.atk<=0)err='Cần tàu chiến để tấn công.';
    if(FM.ms==='recon'&&!(ships.scout>0))err='Cần ít nhất 1 Tàu thăm dò.';
    if(FM.ms==='survey'&&!(ships.scout>0))err='Cần ít nhất 1 Tàu thăm dò để khảo sát.';
    if(FM.ms==='intercept'){if(fs.atk<=0)err='Cần tàu chiến để chặn đánh.';const rr=G.raids.find(x=>x.pid===FM.tp);if(rr)info+=`<br>Địch tới sau <b>${fmtT(rr.t-G.t)}</b> — ${dur<=rr.t-G.t?'<span class="ok">kịp chặn</span>':'<span class="bad">KHÔNG kịp</span>'}`}
    if(FM.ms==='attack'){const tp=PL(FM.tp),doc=tp.owner>0?facDoc(tp.owner):'light',mA=mulVs(ships,doc),mD=mulOf(doc,ships);let w=0;for(let q=0;q<30;q++)if(fight(fs,npcDef({dp:knownDp(tp)}),mA,mD).aw)w++;info+=`<br>Phòng thủ địch: <b>${bandOf(knownDp(tp))}</b>${tp.recon&&G.t-tp.recon.t<reconT()?'':' <span class="dim">(thô — nên do thám)</span>'} · Học thuyết ${CLS[doc]}<br>Dự đoán thắng: <b class="${w>=24?'ok':w<12?'bad':'acc'}">${Math.round(w/30*100)}%</b> (hệ số khắc chế ×${mA.toFixed(2)})`}
  }
  $('#fm-info').innerHTML=info+(err?`<div class="bad">${err}</div>`:'');$('#fm-go').disabled=!!err;
  FM._ships=ships;
}
